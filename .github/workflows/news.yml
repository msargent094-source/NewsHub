name: Refresh news
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_news.py'
      - '.github/workflows/news.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check collector syntax
        run: python -m py_compile scripts/fetch_news.py
      - name: Fetch news
        run: python scripts/fetch_news.py
      - name: Validate feed
        run: |
          python -c "import json; d=json.load(open('data/news.json')); assert isinstance(d.get('articles'),list); assert len(d['articles'])>0; print(len(d['articles']), 'articles validated')"
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh published news feed"
            git push
          fi
