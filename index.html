<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>NewsHub</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;--bg:#0c111b;--card:#172233;--text:#f2f5fa;--muted:#a9b7c8;--accent:#6ea8ff}body.light{color-scheme:light;--bg:#f3f6fa;--card:#fff;--text:#172333;--muted:#53647a;--accent:#195dcc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;background:var(--bg);padding:16px;z-index:3;border-bottom:1px solid #7887a333}main{max-width:850px;margin:auto;padding:14px}h1{font-size:24px;margin:0 0 12px}.controls{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #8492aa55;border-radius:10px;background:var(--card);color:var(--text);padding:10px}button{cursor:pointer}button.active{background:var(--accent);color:#071120}input[type=search]{flex:1;min-width:170px}#status{color:var(--muted);font-size:13px;margin:12px 0}.story{background:var(--card);border-radius:14px;margin:12px 0;padding:15px}.story h2{font-size:18px;margin:8px 0}.story a{color:var(--text);text-decoration:none}.story a:hover{text-decoration:underline}.meta{font-size:12px;color:var(--muted)}.tag{color:var(--accent)}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.actions button{padding:6px 10px}.read{opacity:.58}#sources{display:none;padding:12px;background:var(--card);border-radius:12px;margin-top:12px}#sources.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}label{display:flex;gap:7px;align-items:center}#empty{padding:25px;text-align:center;color:var(--muted)}small{color:var(--muted)}</style></head><body><header><div style="max-width:850px;margin:auto"><h1>📰 NewsHub</h1><div class="controls"><input id="search" type="search" placeholder="Search headlines"><select id="topic"><option value="">All topics</option><option>Australia</option><option>World</option><option>Politics</option><option>Business</option><option>Technology</option><option>Sport</option></select><button id="saved">Saved</button><button id="sourceBtn">Sources</button><button id="theme">☀︎</button><button id="refresh">↻ Refresh</button></div><div id="sources"></div><div id="status">Loading headlines…</div></div></header><main><div id="feed"></div><div id="empty" hidden>No matching articles. Try another source or topic.</div></main><script>
const names=['ABC News','SBS News','The Guardian Australia','Reuters','BBC News','Al Jazeera','Associated Press'];const key='newshub-v1';let settings;try{settings=JSON.parse(localStorage.getItem(key))||{}}catch{settings={}}settings.sources??=names;settings.bookmarks??=[];settings.read??=[];let articles=[],onlySaved=false;const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(settings))}function text(t){return document.createTextNode(t||'')}function el(tag,cls,t){let x=document.createElement(tag);if(cls)x.className=cls;if(t)x.append(text(t));return x}
function renderSources(){const box=$('sources');box.replaceChildren();names.forEach(n=>{let label=el('label'),cb=document.createElement('input');cb.type='checkbox';cb.checked=settings.sources.includes(n);cb.onchange=()=>{settings.sources=names.filter(s=>s===n?cb.checked:settings.sources.includes(s));save();render()};label.append(cb,text(n));box.append(label)})}
function render(){const q=$('search').value.toLowerCase(),topic=$('topic').value;const filtered=articles.filter(a=>settings.sources.includes(a.source)&&(!topic||a.category===topic)&&(!q||(a.title+' '+a.source).toLowerCase().includes(q))&&(!onlySaved||settings.bookmarks.includes(a.id)));const feed=$('feed');feed.replaceChildren();$('empty').hidden=filtered.length>0;filtered.forEach(a=>{const card=el('article','story'+(settings.read.includes(a.id)?' read':''));const meta=el('div','meta',a.source+' · '+new Date(a.published).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'}));const title=el('h2'),link=el('a',null,a.title);link.href=a.url;link.target='_blank';link.rel='noopener noreferrer';link.onclick=()=>{if(!settings.read.includes(a.id))settings.read.push(a.id);save();card.classList.add('read')};title.append(link);const actions=el('div','actions'),category=el('span','tag',a.category||'News'),btn=el('button',null,settings.bookmarks.includes(a.id)?'★ Saved':'☆ Save');btn.onclick=()=>{settings.bookmarks=settings.bookmarks.includes(a.id)?settings.bookmarks.filter(x=>x!==a.id):[...settings.bookmarks,a.id];save();render()};actions.append(category,btn);card.append(meta,title,actions);feed.append(card)})}
async function load(){ $('status').textContent='Checking published feed…';try{const r=await fetch('./data/news.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();articles=Array.isArray(data.articles)?data.articles:[];$('status').textContent=articles.length+' headlines · Feed updated '+(data.updatedAt?new Date(data.updatedAt).toLocaleString('en-AU'):'unknown')+(data.warnings?.length?' · '+data.warnings.length+' source warnings':'');render()}catch(e){$('status').textContent='News feed not available yet. Check the GitHub Actions workflow. '+e.message;render()}}
$('search').oninput=render;$('topic').onchange=render;$('saved').onclick=()=>{onlySaved=!onlySaved;$('saved').classList.toggle('active',onlySaved);render()};$('sourceBtn').onclick=()=>$('sources').classList.toggle('open');$('refresh').onclick=load;$('theme').onclick=()=>{settings.light=!settings.light;document.body.classList.toggle('light',settings.light);save()};document.body.classList.toggle('light',!!settings.light);renderSources();load();setInterval(load,600000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
